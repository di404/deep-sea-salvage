<!DOCTYPE html>
<html><head><meta charset="utf8"><title>Thumbnail generator</title>
<style>body{background:#031523;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
canvas{max-width:90%;border:1px solid #1a5c8a;border-radius:8px;margin:10px}
p{color:#9cc8e6}</style></head>
<body>
<h2>Deep Salvage Inc. — thumbnails (right-click → save image)</h2>
<p>CrazyGames needs: 16:9 cover, square icon. Click a canvas to download.</p>
<canvas id="c169" width="1280" height="720"></canvas>
<canvas id="c11" width="512" height="512"></canvas>
<script type="module">
import { drawCreature } from './js/scene.js';

function bg(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#8ed8f8'); g.addColorStop(.25, '#2a86c9');
  g.addColorStop(.6, '#123a63'); g.addColorStop(1, '#050f1f');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}
function claw(c, x, y, s, hue = 210) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.strokeStyle = '#e6eef5'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(0, -400); c.lineTo(0, -30); c.stroke();
  c.fillStyle = `hsl(${hue},55%,58%)`; c.strokeStyle = `hsl(${hue},50%,32%)`; c.lineWidth = 4;
  c.beginPath(); c.roundRect(-26, -40, 52, 28, 8); c.fill(); c.stroke();
  for (const sd of [-1, 1]) {
    c.save(); c.scale(sd, 1); c.rotate(sd * .35);
    c.beginPath(); c.moveTo(10, -24); c.quadraticCurveTo(46, -4, 38, 30);
    c.quadraticCurveTo(26, 12, 8, 6); c.closePath();
    c.fillStyle = `hsl(${hue},55%,62%)`; c.fill(); c.stroke();
    c.restore();
  }
  c.restore();
}
function compose(c, w, h, s) {
  bg(c, w, h);
  // creatures
  drawCreature(c, { shape: 'squid', hue: 265, sz: 40, glow: 0, prism: 0 }, w * .68, h * .62, 1.3, { scale: 3.2 * s, dir: -1 });
  drawCreature(c, { shape: 'angler', hue: 35, sz: 40, glow: 1, prism: 0 }, w * .2, h * .78, 1.1, { scale: 2.2 * s, dir: 1 });
  drawCreature(c, { shape: 'jelly', hue: 195, sz: 40, glow: 0, prism: 0 }, w * .3, h * .45, 1.5, { scale: 1.8 * s, dir: 1 });
  drawCreature(c, { shape: 'fish', hue: 205, sz: 40, glow: 0, prism: 0 }, w * .15, h * .3, 1.7, { scale: 1.5 * s, dir: 1 });
  drawCreature(c, { shape: 'chest', hue: 28, sz: 40, glow: 0, prism: 0 }, w * .8, h * .82, 1.2, { scale: 1.8 * s, dir: 1 });
  // title bar
  c.fillStyle = 'rgba(4,26,44,.82)';
  c.fillRect(0, h * .82, w, h * .18);
  c.fillStyle = '#ffd257';
  c.font = `900 ${Math.floor(h * .1)}px 'Trebuchet MS', sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('DEEP SALVAGE INC.', w / 2, h * .885);
  c.fillStyle = '#9cc8e6';
  c.font = `${Math.floor(h * .048)}px 'PingFang SC', sans-serif`;
  c.fillText('深海捞捞 · salvage the abyss', w / 2, h * .952);
  claw(c, w * .62, h * .52, s);
}
compose(document.getElementById('c169').getContext('2d'), 1280, 720, 1);
compose(document.getElementById('c11').getContext('2d'), 512, 512, .62);
document.querySelectorAll('canvas').forEach(cv => cv.onclick = () => {
  const a = document.createElement('a');
  a.download = 'thumbnail_' + cv.width + 'x' + cv.height + '.png';
  a.href = cv.toDataURL('image/png'); a.click();
});
</script></body></html>

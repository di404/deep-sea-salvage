<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04263f">
<title>Deep Salvage Inc. — 深海捞捞</title>
<link rel="stylesheet" href="css/style.css">
<script>
window.__errs = [];
window.addEventListener('error', e => {
  window.__errs.push((e.message || 'error') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno);
  var el = document.getElementById('loading');
  if (el) { el.querySelector('.load-sub').textContent = 'Error: ' + e.message; document.title = 'ERR ' + e.message; }
});
window.addEventListener('unhandledrejection', e => {
  window.__errs.push('rejection: ' + (e.reason && e.reason.message || e.reason));
});
</script>
</head>
<body>
<canvas id="game"></canvas>

<!-- Loading overlay (CrazyGames QA: visible loading behavior) -->
<div id="loading"><div class="load-box"><div class="load-title">DEEP SALVAGE INC.</div><div class="load-sub">深海捞捞</div><div class="load-bar"><i id="load-fill"></i></div></div></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-top">
    <div class="pill" id="pill-coins"><span class="ic coin"></span><b id="hud-coins">0</b></div>
    <div class="pill" id="pill-gems"><span class="ic gem"></span><b id="hud-gems">0</b></div>
    <div class="pill depth-pill" id="pill-depth"><span class="ic hook"></span><b id="hud-depth">0m</b></div>
    <div class="spacer"></div>
    <div id="buff-chips"></div>
    <button class="icon-btn" id="btn-settings" aria-label="settings">⚙</button>
  </div>
  <div id="zone-banner" class="hidden"></div>
  <div id="contract-chip" class="hidden"><b id="contract-timer"></b><span id="contract-goal"></span></div>
  <button id="btn-contract" class="side-btn hidden"></button>
  <div id="hud-bottom">
    <nav id="main-nav">
      <button class="nav-btn" data-panel="upgrades"><span class="nav-ic">🔧</span><span class="nav-tx">UP</span><i class="dot hidden"></i></button>
      <button class="nav-btn" data-panel="book"><span class="nav-ic">📖</span><span class="nav-tx">LOG</span><i class="dot hidden"></i></button>
      <button class="nav-btn" data-panel="shop"><span class="nav-ic">🛒</span><span class="nav-tx">SHOP</span><i class="dot hidden"></i></button>
      <button class="nav-btn" data-panel="tasks"><span class="nav-ic">📋</span><span class="nav-tx">JOBS</span><i class="dot hidden"></i></button>
      <button class="nav-btn" data-panel="prestige"><span class="nav-ic">🌀</span><span class="nav-tx">CORE</span><i class="dot hidden"></i></button>
    </nav>
  </div>
  <div id="tut-tip" class="hidden"></div>
</div>

<!-- Slide-up panel -->
<div id="panel" class="hidden"><div id="panel-card"><div id="panel-head"><b id="panel-title"></b><button id="panel-close">✕</button></div><div id="panel-body"></div></div></div>

<!-- Modal popup root -->
<div id="modal-root"></div>

<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onerror="window.__cgSdkFailed=true"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
